name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ==========================================
      # Checkout main branch
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6

      # ==========================================
      # Make sure profile directory exists
      # ==========================================
      - name: Create profile directory
        run: mkdir -p profile

      # ==========================================
      # Generate GitHub Stats
      # ==========================================
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # Generate Top Languages
      # ==========================================
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&count_private=true&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # ==========================================
      # Generate Pac-Man Contribution Graph
      # ==========================================
      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_STATS_TOKEN }}
          games: 'pacman'

      # ==========================================
      # Copy Pac-Man SVGs & Apply Custom Walls
      # ==========================================
      - name: Copy Pac-Man SVGs and Apply Custom Walls
        run: |
          cp dist/pacman-contribution-graph.svg profile/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg profile/pacman-contribution-graph-dark.svg
          python3 scripts/apply_custom_walls.py


      # ==========================================
      # Commit everything to main
      # ==========================================
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
          else
            git commit -m "Update GitHub statistics"
            git push origin HEAD:main
          fi
